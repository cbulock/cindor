name: Create release

on:
  push:
    branches:
      - main
    paths:
      - package-lock.json
      - packages/core/package.json
      - packages/react/package.json
      - packages/vue/package.json
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TRIGGER_TOKEN: ${{ secrets.RELEASE_TRIGGER_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Find the merged Release Please pull request
        id: release-pr
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          result-encoding: string
          script: |
            const associatedPullRequests = await github.paginate(
              github.rest.repos.listPullRequestsAssociatedWithCommit,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: context.sha
              }
            );

            for (const pullRequest of associatedPullRequests) {
              const { data } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pullRequest.number
              });

              const hasPendingLabel = data.labels.some(
                (label) => label.name === "autorelease: pending"
              );
              const isReleasePleasePullRequest =
                data.merged_at !== null &&
                data.merge_commit_sha === context.sha &&
                data.base.ref === "main" &&
                data.head.repo?.full_name === `${context.repo.owner}/${context.repo.repo}` &&
                data.head.ref === "release-please--branches--main" &&
                data.title === "chore: release main";

              if (isReleasePleasePullRequest && hasPendingLabel) {
                return String(data.number);
              }
            }

            core.setFailed(
              "This workflow only creates releases for a merged, pending Release Please pull request."
            );
            return "";

      - name: Require release trigger token
        shell: bash
        run: |
          if [ -z "$RELEASE_TRIGGER_TOKEN" ]; then
            echo "::error::Missing RELEASE_TRIGGER_TOKEN secret. Use a PAT or GitHub App token with permission to create releases so the release event can trigger publish-packages."
            exit 1
          fi

      - name: Determine release version
        id: version
        shell: bash
        run: |
          version=$(node -p "require('./packages/core/package.json').version")
          tag="v${version}"

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Check whether the release already exists
        id: existing-release
        uses: actions/github-script@v7
        env:
          TAG: ${{ steps.version.outputs.tag }}
        with:
          github-token: ${{ env.RELEASE_TRIGGER_TOKEN }}
          result-encoding: string
          script: |
            try {
              const response = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: process.env.TAG
              });

              core.info(
                `Release ${process.env.TAG} already exists for ${response.data.target_commitish}; skipping release creation. Publishing the latest commit requires a new version tag.`
              );
              return "true";
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }

              return "false";
            }

      - name: Create GitHub release
        if: steps.existing-release.outputs.result != 'true'
        uses: actions/github-script@v7
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        with:
          github-token: ${{ env.RELEASE_TRIGGER_TOKEN }}
          script: |
            const prerelease = process.env.VERSION.includes("-");

            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: process.env.TAG,
              target_commitish: context.sha,
              name: process.env.TAG,
              generate_release_notes: true,
              prerelease
            });

      - name: Mark the Release Please pull request as tagged
        uses: actions/github-script@v7
        env:
          RELEASE_PR_NUMBER: ${{ steps.release-pr.outputs.result }}
        with:
          github-token: ${{ github.token }}
          script: |
            const pullNumber = Number(process.env.RELEASE_PR_NUMBER);

            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: "autorelease: tagged"
              });
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }

              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: "autorelease: tagged",
                color: "0e8a16",
                description: "Release Please release created"
              });
            }

            await github.rest.issues.removeLabel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pullNumber,
              name: "autorelease: pending"
            });
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pullNumber,
              labels: ["autorelease: tagged"]
            });
