name: Auto-merge Release Please PRs

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - edited
      - synchronize
      - ready_for_review

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-automerge:
    if: >-
      ${{
        !github.event.pull_request.draft &&
        github.event.pull_request.user.login == 'zeno-codebot' &&
        github.event.pull_request.base.ref == 'main' &&
        github.event.pull_request.head.ref == 'release-please--branches--main' &&
        github.event.pull_request.title == 'chore: release main'
      }}
    runs-on: ubuntu-latest

    steps:
      - name: Enable auto-merge for the release-please PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          REPO: ${{ github.repository }}
        run: |
          auto_merge_state="$(gh pr view "$PR_URL" --repo "$REPO" --json autoMergeRequest --jq 'if .autoMergeRequest == null then "disabled" else "enabled" end')"

          if [ "$auto_merge_state" = "enabled" ]; then
            echo "Auto-merge is already enabled for $PR_URL"
            exit 0
          fi

          gh pr merge "$PR_URL" --repo "$REPO" --auto --squash
