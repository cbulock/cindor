name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    env:
      RELEASE_TRIGGER_TOKEN: ${{ secrets.RELEASE_TRIGGER_TOKEN }}

    steps:
      - name: Require release trigger token
        shell: bash
        run: |
          if [ -z "$RELEASE_TRIGGER_TOKEN" ]; then
            echo "::error::Missing RELEASE_TRIGGER_TOKEN secret. Use a PAT or GitHub App token so Release Please PRs and releases can trigger follow-on workflows."
            exit 1
          fi

      - name: Run Release Please
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ env.RELEASE_TRIGGER_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
